services:
  # ── Laravel API (Web Service) ──────────────────────────────────────────────
  - type: web
    name: smartravel-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Render's free tier — upgrade to "standard" for production
    plan: free

    # Health-check so Render knows when the app is ready
    healthCheckPath: /health

    # Environment variables — add sensitive ones in the Render dashboard
    envVars:
      - key: APP_NAME
        value: "Smart Travel API"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          type: web
          name: smartravel-backend
          property: host
      - key: APP_KEY
        generateValue: true          # Render auto-generates a secure random value

      # Logging
      - key: LOG_CHANNEL
        value: stderr               # Render captures stderr as logs
      - key: LOG_LEVEL
        value: error

      # Database — set after creating a MySQL service (see README)
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: smartravel-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: smartravel-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: smartravel-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: smartravel-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: smartravel-db
          property: password

      # Session / cache — use database driver (no Redis needed on free tier)
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # Filesystem
      - key: FILESYSTEM_DISK
        value: local

      # API keys — set these in Render Dashboard → Environment
      - key: OPENWEATHER_API_KEY
        sync: false                 # Set manually in dashboard
      - key: OPENWEATHER_BASE_URL
        value: "https://api.openweathermap.org/data/3.0"
      - key: PEXELS_API_KEY
        sync: false                 # Set manually in dashboard
      - key: MAPILLARY_ACCESS_TOKEN
        sync: false                 # Optional

      # Web Push (VAPID)
      - key: VAPID_SUBJECT
        value: "mailto:alerts@smartravel.com"
      - key: VAPID_PUBLIC_KEY
        sync: false                 # Set manually in dashboard
      - key: VAPID_PRIVATE_KEY
        sync: false                 # Set manually in dashboard

  # ── MySQL Database ─────────────────────────────────────────────────────────
databases:
  - name: smartravel-db
    databaseName: smartravel
    user: smartravel
    plan: free
